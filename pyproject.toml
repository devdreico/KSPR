[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kspr-engine"
version = "0.1.0"
description = "KSPR - Reverse Engineering Artificial Intelligence Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["kspr_engine*"]

[tool.vercel]
entrypoint = "backend.kspr_engine.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
